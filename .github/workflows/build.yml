name: Build

# Produce downloadable desktop binaries.
#
# Every push to main uploads one archive per platform to the workflow run, so a
# build can be downloaded and tested without cutting a release. Pushing a `v*`
# tag additionally publishes those same archives as a GitHub Release.
#
# The shell binary, session viewer included, cross-builds from a single Linux
# runner: the SDL3 binding is purego and bundles the library, so `make build-all`
# needs no cgo and no per-OS runners for the six shell targets. The one cgo
# artifact is the embedded-webview child (cmd/kube-workspaces-web); it must be
# built per OS where the webview toolchain lives (WebKitGTK, WebKit, WebView2).
# The web-child matrix job builds it natively per OS (Linux/amd64+arm64 in a
# jammy container that still ships webkit2gtk-4.0, both macOS arches on a Mac
# runner, Windows/amd64 with MinGW), and the assemble job drops each child next
# to its shell before the archives are staged. Branches without a child (see
# the matrix comments for the toolchain gaps) stay shell-only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so `git describe` can name the build after the last
          # tag rather than falling back to a bare sha.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: make build-all VERSION=${{ steps.version.outputs.version }}

      - name: Verify the native binary runs
        run: |
          set -euo pipefail
          tar -xzf dist/kube-workspaces-${{ steps.version.outputs.version }}-linux-amd64.tar.gz -C /tmp
          got=$(/tmp/kube-workspaces-linux-amd64/kube-workspaces version)
          echo "reported version: $got"
          test "$got" = "${{ steps.version.outputs.version }}"

      # v0.1.0 shipped Windows binaries linked as console subsystem executables.
      # The symptom only showed up on a user's machine — a stray console window
      # next to the GUI, which killed the app when closed — so it is worth
      # asserting here rather than trusting the Makefile. The subsystem lives in
      # the PE optional header: 2 is IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 is the
      # console one that caused the bug. See cmd/kube-workspaces/console_windows.go
      # for why the flag alone is not the whole fix.
      - name: Verify the Windows binaries are GUI subsystem
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            unzip -qo "dist/kube-workspaces-${{ steps.version.outputs.version }}-windows-$arch.zip" -d /tmp/pecheck
            python3 - "/tmp/pecheck/kube-workspaces-windows-$arch/kube-workspaces.exe" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as fh:
              data = fh.read()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe + 4] == b"PE\0\0", f"{path}: not a PE binary"
          subsystem = struct.unpack_from("<H", data, pe + 4 + 20 + 68)[0]
          if subsystem != 2:
              sys.exit(f"::error::{path}: PE subsystem is {subsystem}, want 2 (WINDOWS_GUI). "
                       "A console subsystem build opens a stray console window; check that "
                       "the Makefile still passes -H=windowsgui for windows targets.")
          print(f"{path}: PE subsystem 2 (WINDOWS_GUI)")
          PY
          done

      # Raw shell-only archives: the public artifacts (see the assemble job)
      # are these plus the injected web child. Keeping the two stages separate
      # means a webview toolchain regression unblocks the shell release.
      - name: Upload linux/amd64
        uses: actions/upload-artifact@v5
        with:
          name: shell-linux-amd64
          path: dist/*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v5
        with:
          name: shell-linux-arm64
          path: dist/*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v5
        with:
          name: shell-darwin-amd64
          path: dist/*-darwin-amd64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v5
        with:
          name: shell-darwin-arm64
          path: dist/*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v5
        with:
          name: shell-windows-amd64
          path: dist/*-windows-amd64.zip
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v5
        with:
          name: shell-windows-arm64
          path: dist/*-windows-arm64.zip
          if-no-files-found: error

  web-child:
    name: Web child (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    # Each webview toolchain is best built natively: the Linux child needs
    # webkit2gtk-4.0 (dropped from Ubuntu 24.04, still on jammy), the macOS one
    # the Xcode SDK, the Windows one MinGW. Cross-compiling cgo to other OSes
    # from a single host is exactly what we do NOT want to hand-tool here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: linux
            arch: amd64
            runs-on: ubuntu-latest
            container: ubuntu:22.04
          # ARM64 GitHub runners are available for public repos (ubuntu-24.04-arm),
          # and the jammy container resolves to its arm64 variant there.
          - platform: linux-arm64
            os: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            container: ubuntu:22.04
          # macOS cgo cross-builds are native enough on a single runner: the
          # Xcode SDK builds both arches, so one macos-latest covers both GOARCH.
          - platform: darwin-amd64
            os: darwin
            arch: amd64
            runs-on: macos-latest
          - platform: darwin-arm64
            os: darwin
            arch: arm64
            runs-on: macos-latest
          - platform: windows-amd64
            os: windows
            arch: amd64
            runs-on: windows-latest
          # windows/arm64 has no maintainable cross toolchain on GitHub runners
          # (no ARM64 MinGW), so it stays shell-only until one exists.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Install Linux webview toolchain
        if: startsWith(matrix.os, 'linux')
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Ensure MinGW on Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue) -or
              -not (Get-Command g++ -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
            "PATH=$machinePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }
          gcc --version | Select-Object -First 1

      - name: Build web child (Linux/macOS)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o kube-workspaces-web ./cmd/kube-workspaces-web

      - name: Build web child (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          $msweb = ("${{ github.workspace }}/internal/web/mswebview2").Replace('\','/')
          $env:CGO_CXXFLAGS = "-I$msweb"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }} -H=windowsgui" `
            -o kube-workspaces-web.exe ./cmd/kube-workspaces-web

      - name: Upload web child
        uses: actions/upload-artifact@v5
        with:
          name: web-child-${{ matrix.platform }}
          path: kube-workspaces-web*
          if-no-files-found: error

  assemble:
    name: Assemble archives
    runs-on: ubuntu-latest
    needs: [build, web-child]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The injection script ships in the repo, and git describe must agree
          # with the build job's version string (same ref, clean tree).
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Download shell archives
        uses: actions/download-artifact@v5
        with:
          pattern: shell-*
          path: shell
          github-token: ${{ github.token }}

      - name: Download web children
        uses: actions/download-artifact@v5
        with:
          pattern: web-child-*
          path: web
          github-token: ${{ github.token }}

      # The web child ships inside the archive only when a native toolchain
      # built one for that platform (windows/arm64 never has; linux/arm64 does
      # if the ARM runner is available). Shell-only targets go out as-is.
      - name: Inject web children and regenerate checksums
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p final
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            os=${plat%-*}
            ext=tar.gz
            [ "$os" = windows ] && ext=zip
            archive="kube-workspaces-$version-$plat.$ext"
            cp "shell/shell-$plat/$archive" "final/$archive"
            child="$(ls web/web-child-$plat/* 2>/dev/null | head -1 || true)"
            if [ -n "$child" ]; then
              scripts/insert-web-child.sh "final/$archive" "$child"
            else
              echo "assemble: no web child for $plat; shipping shell-only archive"
            fi
          done
          (cd final && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat final/SHA256SUMS

      - name: Upload linux/amd64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-linux-amd64
          path: final/kube-workspaces-*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-linux-arm64
          path: final/kube-workspaces-*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-darwin-amd64
          path: final/kube-workspaces-*-darwin-amd64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-darwin-arm64
          path: final/kube-workspaces-*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-windows-amd64
          path: final/kube-workspaces-*-windows-amd64.zip
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v5
        with:
          name: kube-workspaces-windows-arm64
          path: final/kube-workspaces-*-windows-arm64.zip
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: SHA256SUMS
          path: final/SHA256SUMS
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Desktop client \`${{ steps.version.outputs.version }}\`"
            echo
            echo "Download an archive from the **Artifacts** section of this run."
            echo
            echo '```'
            cat final/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    # Only for tag pushes. Tags are created deliberately, never by automation.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web-child]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build all targets
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Download web children
        uses: actions/download-artifact@v5
        with:
          pattern: web-child-*
          path: web
          github-token: ${{ github.token }}

      - name: Inject web children into the tag archives
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            os=${plat%-*}
            ext=tar.gz
            [ "$os" = windows ] && ext=zip
            archive="kube-workspaces-$version-$plat.$ext"
            child="$(ls web/web-child-$plat/* 2>/dev/null | head -1 || true)"
            if [ -n "$child" ]; then
              scripts/insert-web-child.sh "dist/$archive" "$child"
            else
              echo "release: no web child for $plat; releasing shell-only archive"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      # Notes are assembled here rather than left to --generate-notes alone:
      # a desktop binary needs download links and install steps, and these
      # builds are unsigned, which users must be told before macOS or Windows
      # tells them in a more alarming way.
      - name: Compose release notes
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$VERSION"
          {
            echo "Native desktop client for Kube Workspaces: sign in to an instance, browse your"
            echo "workspaces, and open a VM workspace's display in a real window."
            echo
            echo "## Download"
            echo
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo "| Linux | x86_64 | [\`kube-workspaces-$VERSION-linux-amd64.tar.gz\`]($base/kube-workspaces-$VERSION-linux-amd64.tar.gz) |"
            echo "| Linux | arm64 | [\`kube-workspaces-$VERSION-linux-arm64.tar.gz\`]($base/kube-workspaces-$VERSION-linux-arm64.tar.gz) |"
            echo "| macOS | Apple silicon | [\`kube-workspaces-$VERSION-darwin-arm64.tar.gz\`]($base/kube-workspaces-$VERSION-darwin-arm64.tar.gz) |"
            echo "| macOS | Intel | [\`kube-workspaces-$VERSION-darwin-amd64.tar.gz\`]($base/kube-workspaces-$VERSION-darwin-amd64.tar.gz) |"
            echo "| Windows | x86_64 | [\`kube-workspaces-$VERSION-windows-amd64.zip\`]($base/kube-workspaces-$VERSION-windows-amd64.zip) |"
            echo "| Windows | arm64 | [\`kube-workspaces-$VERSION-windows-arm64.zip\`]($base/kube-workspaces-$VERSION-windows-arm64.zip) |"
            echo
            echo "Verify with [\`SHA256SUMS\`]($base/SHA256SUMS): \`sha256sum -c SHA256SUMS\`"
            echo
            echo "## Install"
            echo
            echo '**Linux**'
            echo
            echo '```bash'
            echo "tar -xzf kube-workspaces-$VERSION-linux-amd64.tar.gz"
            echo "cd kube-workspaces-linux-amd64"
            echo "./kube-workspaces --help"
            echo '```'
            echo
            echo '**macOS** — the archive contains a `Kube Workspaces.app` bundle. Drag it to'
            echo 'Applications, or open it in place:'
            echo
            echo '```bash'
            echo "tar -xzf kube-workspaces-$VERSION-darwin-arm64.tar.gz"
            echo 'open "kube-workspaces-darwin-arm64/Kube Workspaces.app"'
            echo '```'
            echo
            echo '**Windows** — unzip and run `kube-workspaces.exe`.'
            echo
            echo "> **These binaries are not code-signed.** macOS Gatekeeper will refuse to run"
            echo "> the app the first time: clear the quarantine attribute with"
            echo "> \`xattr -d com.apple.quarantine 'Kube Workspaces.app'\`, or open it once via"
            echo "> Finder → right-click → Open. Windows SmartScreen will warn: choose"
            echo "> \"More info\" → \"Run anyway\". Signing and notarisation are not yet set up."
            echo
            echo "The shell is cgo-free and bundles SDL. Container/scratch workspaces open in the"
            echo "embedded webview child (\`kube-workspaces-web\`) that ships inside each archive;"
            echo "on Linux that child needs WebKitGTK 2.4 (\`libwebkit2gtk-4.0\`). macOS and Windows"
            echo "use their bundled engines (WebKit, WebView2)."
            echo
            echo "## Getting started"
            echo
            echo '```bash'
            echo "kube-workspaces login --server https://workspaces.example.com  # opens your browser"
            echo "kube-workspaces list --running"
            echo "kube-workspaces                                                # graphical shell"
            echo '```'
            echo
            echo "If browser login gives trouble, \`--token <session-token>\` bypasses it."
            echo "On a machine with no OS keychain, set"
            echo "\`KUBE_WORKSPACES_INSECURE_TOKEN_FILE=1\` to fall back to a 0600 file."
            echo
            echo "## What works"
            echo
            echo "Sign-in (browser OIDC via RFC 8252 loopback + PKCE, or local accounts),"
            echo "workspace discovery, VM display sessions (Raw/CopyRect/RRE/Hextile/Zlib/Tight/ZRLE),"
            echo "guest audio playback (QEMU audio extension), keyboard/mouse/scroll wheel,"
            echo "bidirectional clipboard, guest display resize, and automatic reconnect."
            echo
            echo "## What does not"
            echo
            echo "- **No adaptive quality.** Encoding quality is fixed, not bandwidth-driven."
            echo "- **No in-guest agent (Tier 1).** Sessions use the hypervisor console, which"
            echo "  has no video codec — fine for desktops and text, poor for full-motion video."
            echo "- **Container workspaces still open in a browser**, not in the client."
            echo "- **Single session at a time per VM.** The hypervisor display is single-session"
            echo "  server-side; the client can open multiple windows for different VMs."
            echo "- No HiDPI scaling, no text selection in input fields, ASCII-only text."
            echo
            echo "## Known caveats"
            echo
            echo "This is an early release. The UI has had limited validation on real displays,"
            echo "so expect rough edges in layout and scaling. Please report what you find."
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      # Idempotent: a re-pushed tag (amended commit) re-triggers this job with a
      # release already present, and `gh release create` then fails. Edit the
      # release and clobber-upload the assets instead of erroring.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber