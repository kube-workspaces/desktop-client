name: Build

# Produce downloadable desktop binaries.
#
# Every push to main uploads one archive per platform to the workflow run, so a
# build can be downloaded and tested without cutting a release. Pushing a `v*`
# tag additionally publishes those same archives as a GitHub Release.
#
# The shell binary, session viewer included, cross-builds from a single Linux
# runner: the SDL3 binding is purego and bundles the library, so `make build-all`
# needs no cgo and no per-OS runners for the six shell targets. The one cgo
# artifact is the embedded-webview child (cmd/kube-workspaces-web); it must be
# built per OS where the webview toolchain lives (WebKitGTK, WebKit, WebView2).
# The web-child matrix job builds it natively per OS (Linux/amd64+arm64 in a
# noble container that ships webkit2gtk-4.1, both macOS arches on a Mac
# runner, Windows/amd64 with MinGW), and the assemble job drops each child next
# to its shell before the archives are staged. Branches without a child (see
# the matrix comments for the toolchain gaps) stay shell-only. The msi job
# then builds the unsigned per-arch Windows MSIs (WiX, windows-latest) from
# the assembled archives; on a `v*` tag the release job publishes archives +
# MSIs with checksums recomputed after MSI creation.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Cross-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so `git describe` can name the build after the last
          # tag rather than falling back to a bare sha.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: make build-all VERSION=${{ steps.version.outputs.version }}

      - name: Verify shell update archive contract
        run: python3 scripts/verify-update-archives.py dist '${{ steps.version.outputs.version }}' --shell-only

      - name: Verify the native binary runs
        run: |
          set -euo pipefail
          tar -xzf dist/kube-workspaces-${{ steps.version.outputs.version }}-linux-amd64.tar.gz -C /tmp
          got=$(/tmp/kube-workspaces-linux-amd64/kube-workspaces version)
          echo "reported version: $got"
          test "$got" = "${{ steps.version.outputs.version }}"

      # v0.1.0 shipped Windows binaries linked as console subsystem executables.
      # The symptom only showed up on a user's machine — a stray console window
      # next to the GUI, which killed the app when closed — so it is worth
      # asserting here rather than trusting the Makefile. The subsystem lives in
      # the PE optional header: 2 is IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 is the
      # console one that caused the bug. See cmd/kube-workspaces/console_windows.go
      # for why the flag alone is not the whole fix.
      - name: Verify the Windows binaries are GUI subsystem
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            unzip -qo "dist/kube-workspaces-${{ steps.version.outputs.version }}-windows-$arch.zip" -d /tmp/pecheck
            python3 - "/tmp/pecheck/kube-workspaces-windows-$arch/kube-workspaces.exe" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as fh:
              data = fh.read()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe + 4] == b"PE\0\0", f"{path}: not a PE binary"
          subsystem = struct.unpack_from("<H", data, pe + 4 + 20 + 68)[0]
          if subsystem != 2:
              sys.exit(f"::error::{path}: PE subsystem is {subsystem}, want 2 (WINDOWS_GUI). "
                       "A console subsystem build opens a stray console window; check that "
                       "the Makefile still passes -H=windowsgui for windows targets.")
          print(f"{path}: PE subsystem 2 (WINDOWS_GUI)")
          PY
          done

      # Raw shell-only archives: the public artifacts (see the assemble job)
      # are these plus the injected web child. Keeping the two stages separate
      # means a webview toolchain regression unblocks the shell release.
      - name: Upload linux/amd64
        uses: actions/upload-artifact@v7
        with:
          name: shell-linux-amd64
          path: dist/*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v7
        with:
          name: shell-linux-arm64
          path: dist/*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v7
        with:
          name: shell-darwin-amd64
          path: dist/*-darwin-amd64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v7
        with:
          name: shell-darwin-arm64
          path: dist/*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v7
        with:
          name: shell-windows-amd64
          path: dist/*-windows-amd64.zip
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v7
        with:
          name: shell-windows-arm64
          path: dist/*-windows-arm64.zip
          if-no-files-found: error

  web-child:
    name: Web child (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    # Each webview toolchain is best built natively: the Linux child needs a
    # webkit2gtk-4.1 dev stack (the 4.0 runtime is gone from modern distros —
    # Ubuntu 24.04+, Debian 12+ — so the fork in third_party/webview_go pins
    # 4.1), the macOS one the Xcode SDK, the Windows one MinGW. Cross-compiling
    # cgo to other OSes from a single host is exactly what we do NOT want to
    # hand-tool here.
    defaults:
      run:
        # The noble container runs steps under sh by default; our steps need
        # bash (set -o pipefail). The Windows step overrides shell: pwsh.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: linux
            arch: amd64
            runs-on: ubuntu-24.04
            container: ubuntu:24.04
          # ARM64 GitHub runners are available for public repos (ubuntu-24.04-arm),
          # and the noble container resolves to its arm64 variant there.
          - platform: linux-arm64
            os: linux
            arch: arm64
            runs-on: ubuntu-24.04-arm
            container: ubuntu:24.04
          # macOS cgo cross-builds are native enough on a single runner: the
          # Xcode SDK builds both arches, so one macos-latest covers both GOARCH.
          - platform: darwin-amd64
            os: darwin
            arch: amd64
            runs-on: macos-latest
          - platform: darwin-arm64
            os: darwin
            arch: arm64
            runs-on: macos-latest
          - platform: windows-amd64
            os: windows
            arch: amd64
            runs-on: windows-latest
          # windows/arm64 has no maintainable cross toolchain on GitHub runners
          # (no ARM64 MinGW), so it stays shell-only until one exists.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Install Linux webview toolchain
        if: startsWith(matrix.os, 'linux')
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            ca-certificates

      - name: Ensure MinGW on Windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue) -or
              -not (Get-Command g++ -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
            "PATH=$machinePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          }
          gcc --version | Select-Object -First 1

      - name: Build web child (Linux/macOS)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o kube-workspaces-web ./cmd/kube-workspaces-web

      # Without these the child's .exe would sit in Explorer under the blank
      # default icon: the PE resources only exist in the checkout once go-winres
      # has generated them, and the linker only picks up a .syso when GOOS=windows.
      - name: Generate Windows resources for web child
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/kube-workspaces-web/winres.json --out cmd/kube-workspaces-web/rsrc --arch=amd64 --product-version=git-tag --file-version=git-tag

      - name: Build web child (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          $msweb = ("${{ github.workspace }}/internal/web/mswebview2").Replace('\','/')
          $env:CGO_CXXFLAGS = "-I$msweb"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }} -H=windowsgui" `
            -o kube-workspaces-web.exe ./cmd/kube-workspaces-web

      - name: Upload web child
        uses: actions/upload-artifact@v7
        with:
          name: web-child-${{ matrix.platform }}
          path: kube-workspaces-web*
          if-no-files-found: error

  assemble:
    name: Assemble archives
    runs-on: ubuntu-24.04
    needs: [build, web-child]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The injection script ships in the repo, and git describe must agree
          # with the build job's version string (same ref, clean tree).
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Download shell archives
        uses: actions/download-artifact@v8
        with:
          pattern: shell-*
          path: shell
          github-token: ${{ github.token }}

      - name: Download web children
        uses: actions/download-artifact@v8
        with:
          pattern: web-child-*
          path: web
          github-token: ${{ github.token }}

      # The web child ships inside the archive only when a native toolchain
      # built one for that platform (windows/arm64 never has; linux/arm64 does
      # if the ARM runner is available). Shell-only targets go out as-is.
      - name: Inject web children and regenerate checksums
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p final
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            os=${plat%-*}
            ext=tar.gz
            [ "$os" = windows ] && ext=zip
            archive="kube-workspaces-$version-$plat.$ext"
            cp "shell/shell-$plat/$archive" "final/$archive"
            child="$(ls web/web-child-$plat/* 2>/dev/null | head -1 || true)"
            if [ -n "$child" ]; then
              scripts/insert-web-child.sh "final/$archive" "$child"
            else
              echo "assemble: no web child for $plat; shipping shell-only archive"
            fi
          done
          (cd final && sha256sum *.tar.gz *.zip > SHA256SUMS)
          cat final/SHA256SUMS

      - name: Verify assembled update archive contract
        run: python3 scripts/verify-update-archives.py final '${{ steps.version.outputs.version }}'

      # The Linux amd64 AppImage is an extra artifact on top of the six-archive
      # updater contract; the contract + SHA256SUMS are untouched above, and the
      # AppImage goes out with a sidecar .sha256 instead (see the script doc).
      - name: Install AppImage tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            squashfs-tools desktop-file-utils

      - name: Build Linux amd64 AppImage
        run: scripts/build-appimage.sh final/kube-workspaces-${{ steps.version.outputs.version }}-linux-amd64.tar.gz '${{ steps.version.outputs.version }}' appimage

      - name: Upload Linux amd64 AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-linux-amd64
          path: appimage/
          if-no-files-found: error

      - name: Upload linux/amd64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-linux-amd64
          path: final/kube-workspaces-*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-linux-arm64
          path: final/kube-workspaces-*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-darwin-amd64
          path: final/kube-workspaces-*-darwin-amd64.tar.gz
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-darwin-arm64
          path: final/kube-workspaces-*-darwin-arm64.tar.gz
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-windows-amd64
          path: final/kube-workspaces-*-windows-amd64.zip
          if-no-files-found: error

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v7
        with:
          name: kube-workspaces-windows-arm64
          path: final/kube-workspaces-*-windows-arm64.zip
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: archive-SHA256SUMS
          path: final/SHA256SUMS
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Desktop client \`${{ steps.version.outputs.version }}\`"
            echo
            echo "Download an archive from the **Artifacts** section of this run."
            echo
            echo '```'
            cat final/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Unsigned Windows MSI (install hygiene only — NOT a trust fix). Built from
  # the assembled tag archives on a Windows runner (WiX needs Windows), one
  # MSI per arch: amd64 carries shell + web child, arm64 is shell-only. Runs
  # on every push so a broken .wxs breaks the build, not the release; only
  # tag pushes publish (see the release job). When Authenticode is funded, a
  # sign-windows step slots in here before upload (see AGENTS.md Deferred).
  msi:
    name: Unsigned MSI (${{ matrix.arch }})
    runs-on: windows-latest
    needs: [assemble]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: kube-workspaces-windows-amd64
          - arch: arm64
            artifact: kube-workspaces-windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        # On a release tag the MSI metadata (file name, ProductVersion) must
        # come from the tag itself, never from a describe string that could
        # drift. Dev builds keep git describe (sanitized to 0.0.0 by the
        # build script).
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME
          } else {
            $v = (git describe --tags --always --dirty)
          }
          echo "version=$v" >> "$env:GITHUB_OUTPUT"

      - name: Guard release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ('${{ steps.version.outputs.version }}' -notmatch '^v\d+\.\d+\.\d+$') {
            throw "MSI release version must be an exact tag, got '${{ steps.version.outputs.version }}'"
          }

      - name: Download assembled Windows archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: archive
          github-token: ${{ github.token }}

      - name: Setup .NET for WiX
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build unsigned MSI
        shell: pwsh
        run: |
          $zip = Get-Item 'archive/kube-workspaces-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.zip'
          $stage = Join-Path $env:RUNNER_TEMP "msi-stage"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive $zip.FullName -DestinationPath $stage -Force
          $inner = Get-Item (Join-Path $stage 'kube-workspaces-windows-${{ matrix.arch }}')
          New-Item -ItemType Directory -Path out -Force | Out-Null
          & packaging/windows/build-msi.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Arch ${{ matrix.arch }} `
            -StagingDir $inner.FullName `
            -OutFile "out/kube-workspaces-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}.msi"

      - name: Test MSI lifecycle (amd64)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          & packaging/windows/test-msi.ps1 -StagingDir "$env:RUNNER_TEMP/msi-stage/kube-workspaces-windows-amd64"

      - name: Upload installer logs
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: msi-test-logs
          path: ${{ runner.temp }}/msi-lifecycle/*.log
          if-no-files-found: ignore

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi-windows-${{ matrix.arch }}
          path: out/*.msi
          if-no-files-found: error

  # Native Linux system packages (.deb, .rpm, Flatpak bundle) from the
  # assembled archives, one arch per runner: rpmbuild refuses cross-arch
  # builds and flatpak-builder targets its host, so arm64 rides the ARM
  # runner the web-child matrix already uses. Like the MSI and AppImage
  # these sit outside the updater contract (sidecar checksums, SHA256SUMS
  # untouched) and like it they are unsigned.
  linux-packages:
    name: Linux packages (${{ matrix.goarch }})
    needs: [assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runs-on: ubuntu-24.04
          - goarch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Download assembled archive
        uses: actions/download-artifact@v8
        with:
          name: kube-workspaces-linux-${{ matrix.goarch }}
          path: final
          github-token: ${{ github.token }}

      - name: Build .deb
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          scripts/build-deb.sh "final/kube-workspaces-$version-linux-${{ matrix.goarch }}.tar.gz" "$version" pkgs

      - name: Install rpm tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends rpm

      - name: Build .rpm
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          scripts/build-rpm.sh "final/kube-workspaces-$version-linux-${{ matrix.goarch }}.tar.gz" "$version" pkgs

      - name: Install Flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          scripts/build-flatpak.sh "final/kube-workspaces-$version-linux-${{ matrix.goarch }}.tar.gz" "$version" pkgs

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.goarch }}
          path: pkgs/
          if-no-files-found: error

  checksums:
    name: Verify final distribution
    runs-on: ubuntu-24.04
    needs: [assemble, msi]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: kube-workspaces-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: msi-windows-*
          path: dist
          merge-multiple: true
      - name: Check all eight artifacts
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip *.msi > SHA256SUMS)
          python3 scripts/verify-update-archives.py dist "$(git describe --tags --always --dirty)" --require-msi
          {
            echo '### Windows installers'
            echo 'Download `msi-windows-amd64` or `msi-windows-arm64` from this run.'
            echo 'Unsigned; per-user installation by default. ARM64 is shell-only.'
            echo 'The SHA256SUMS artifact covers all six archives and both MSIs.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    # Only for tag pushes. Tags are created deliberately, never by automation.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums, linux-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Publish the exact archives verified by assemble and consumed by MSI.
      - name: Download assembled archives
        uses: actions/download-artifact@v8
        with:
          pattern: kube-workspaces-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}

      # The msi job built the unsigned MSIs from the assembled archives of
      # this same ref. Checksums are (re)computed AFTER the MSIs land in
      # dist/, same rule as future signing: signing/MSI creation changes
      # bytes, so checksums computed before are wrong.
      - name: Download unsigned MSIs
        uses: actions/download-artifact@v8
        with:
          pattern: msi-windows-*
          path: msi
          github-token: ${{ github.token }}

      # The AppImage (extra artifact, outside SHA256SUMS) rides along with its
      # sidecar checksum, produced in the assemble job from these same archives.
      - name: Download Linux amd64 AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage-linux-amd64
          path: appimage
          github-token: ${{ github.token }}

      # Native Linux packages (extra artifacts, outside SHA256SUMS like the
      # AppImage and MSI-adjacent flow): debs, rpms and the Flatpak bundle
      # with sidecar checksums, built in linux-packages from these archives.
      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-packages-*
          path: linuxpkgs
          github-token: ${{ github.token }}

      - name: Stage MSIs and recompute checksums
        run: |
          set -euo pipefail
          cp msi/msi-windows-*/*.msi dist/
          ls dist/*.msi
          (cd dist && sha256sum *.tar.gz *.zip *.msi > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Verify release update archive contract
        run: python3 scripts/verify-update-archives.py dist '${{ github.ref_name }}' --require-msi

      # The generator lives in the deploy repo so all kube-workspaces
      # repositories classify commits the same way. It is authoritative for the
      # "Summary" preamble and the categorised commit list; the download,
      # install and capability text below is client-specific.
      - name: Fetch the release-notes generator
        run: |
          curl -fsSLo /tmp/release-notes.sh \
            https://raw.githubusercontent.com/kube-workspaces/deploy/main/scripts/release-notes.sh
          chmod +x /tmp/release-notes.sh

      # Notes are assembled here rather than left to --generate-notes alone:
      # a desktop binary needs download links and install steps, and these
      # builds are unsigned, which users must be told before macOS or Windows
      # tells them in a more alarming way.
      - name: Compose release notes
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$VERSION"
          # Native package file names carry host-dependent bits (the rpm
          # dist tag), so resolve them from the downloaded artifacts
          # rather than reconstructing them from the version.
          deb_amd64="$(basename linuxpkgs/*/*_amd64.deb)"
          deb_arm64="$(basename linuxpkgs/*/*_arm64.deb)"
          rpm_amd64="$(basename linuxpkgs/*/*.x86_64.rpm)"
          rpm_arm64="$(basename linuxpkgs/*/*.aarch64.rpm)"
          flatpak="io.github.kubeworkspaces.KubeWorkspaces-$VERSION.flatpak"
          {
            echo "Native desktop client for Kube Workspaces: sign in to an instance, browse your"
            echo "workspaces, and open a VM workspace's display in a real window."
            echo
            echo "## Download"
            echo
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo "| Linux | x86_64 | [\`kube-workspaces-$VERSION-linux-amd64.tar.gz\`]($base/kube-workspaces-$VERSION-linux-amd64.tar.gz) |"
            echo "| Linux | x86_64 | **AppImage** [\`kube-workspaces-$VERSION-linux-amd64.AppImage\`]($base/kube-workspaces-$VERSION-linux-amd64.AppImage) |"
            echo "| Linux | x86_64 | **deb** [\`$deb_amd64\`]($base/$deb_amd64) |"
            echo "| Linux | x86_64 | **rpm** [\`$rpm_amd64\`]($base/$rpm_amd64) |"
            echo "| Linux | x86_64 | **Flatpak** [\`$flatpak\`]($base/$flatpak) |"
            echo "| Linux | arm64 | [\`kube-workspaces-$VERSION-linux-arm64.tar.gz\`]($base/kube-workspaces-$VERSION-linux-arm64.tar.gz) |"
            echo "| Linux | arm64 | **deb** [\`$deb_arm64\`]($base/$deb_arm64) |"
            echo "| Linux | arm64 | **rpm** [\`$rpm_arm64\`]($base/$rpm_arm64) |"
            echo "| macOS | Apple silicon | [\`kube-workspaces-$VERSION-darwin-arm64.tar.gz\`]($base/kube-workspaces-$VERSION-darwin-arm64.tar.gz) |"
            echo "| macOS | Intel | [\`kube-workspaces-$VERSION-darwin-amd64.tar.gz\`]($base/kube-workspaces-$VERSION-darwin-amd64.tar.gz) |"
            echo "| Windows | x86_64 | [\`kube-workspaces-$VERSION-windows-amd64.zip\`]($base/kube-workspaces-$VERSION-windows-amd64.zip) |"
            echo "| Windows | arm64 | [\`kube-workspaces-$VERSION-windows-arm64.zip\`]($base/kube-workspaces-$VERSION-windows-arm64.zip) |"
            echo "| Windows | x86_64 | **unsigned test MSI** [\`kube-workspaces-$VERSION-windows-amd64.msi\`]($base/kube-workspaces-$VERSION-windows-amd64.msi) |"
            echo "| Windows | arm64 | **unsigned test MSI** [\`kube-workspaces-$VERSION-windows-arm64.msi\`]($base/kube-workspaces-$VERSION-windows-arm64.msi) |"
            echo
            echo "Verify with [\`SHA256SUMS\`]($base/SHA256SUMS): \`sha256sum -c SHA256SUMS\` (covers zips, tarballs and MSIs)"
            echo
            echo "The AppImage is not part of \`SHA256SUMS\` (the in-app updater contract covers"
            echo "the six archives); it ships its own sidecar: \`sha256sum -c kube-workspaces-$VERSION-linux-amd64.AppImage.sha256\`."
            echo "The same holds for the native packages below: each ships its own sidecar checksum."
            echo
            echo "## Install"
            echo
            echo '**Linux**'
            echo
            echo '```bash'
            echo "tar -xzf kube-workspaces-$VERSION-linux-amd64.tar.gz"
            echo "cd kube-workspaces-linux-amd64"
            echo "./kube-workspaces --help"
            echo '```'
            echo
            echo "or the AppImage (no install step; a KDE/GNOME launcher entry appears when you"
            echo 'integration-mount the file):'
            echo
            echo '```bash'
            echo "wget $base/kube-workspaces-$VERSION-linux-amd64.AppImage $base/kube-workspaces-$VERSION-linux-amd64.AppImage.sha256"
            echo "sha256sum -c kube-workspaces-$VERSION-linux-amd64.AppImage.sha256"
            echo "chmod +x kube-workspaces-$VERSION-linux-amd64.AppImage"
            echo "./kube-workspaces-$VERSION-linux-amd64.AppImage"
            echo '```'
            echo
            echo 'or the native system packages (Debian/Ubuntu, Fedora/RHEL — unsigned,'
            echo 'like everything above):'
            echo
            echo '```bash'
            echo "sudo dpkg -i $deb_amd64        # or: sudo rpm -i $rpm_amd64"
            echo "kube-workspaces --help"
            echo '```'
            echo
            echo 'or the Flatpak bundle (needs the GNOME 48 runtime from Flathub once):'
            echo
            echo '```bash'
            echo "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
            echo "flatpak install flathub org.gnome.Platform//48"
            echo "flatpak install --user $flatpak"
            echo "flatpak run io.github.kubeworkspaces.KubeWorkspaces"
            echo '```'
            echo
            echo 'System packages disable the in-app updater (your package manager owns'
            echo 'those files now); update them with `apt`/`dnf`/`flatpak update`. The web'
            echo 'view needs WebKitGTK 4.1 (Debian 12+, Ubuntu 24.04+, Fedora 41+).'
            echo
            echo '**macOS** — the archive contains a `Kube Workspaces.app` bundle. Drag it to'
            echo 'Applications, or open it in place:'
            echo
            echo '```bash'
            echo "tar -xzf kube-workspaces-$VERSION-darwin-arm64.tar.gz"
            echo 'open "kube-workspaces-darwin-arm64/Kube Workspaces.app"'
            echo '```'
            echo
            echo '**Windows** — recommended: unzip into `%LocalAppData%\Programs\Kube Workspaces`'
            echo '(writable without UAC, so the built-in updater works unelevated), keep both'
            echo '`.exe`s together in one folder, then unblock and run:'
            echo
            echo '```powershell'
            echo "Expand-Archive kube-workspaces-$VERSION-windows-amd64.zip -DestinationPath \"\$env:TEMP\kw-install\" -Force"
            echo 'New-Item -ItemType Directory -Force "$env:LocalAppData\Programs\Kube Workspaces" | Out-Null'
            echo 'Copy-Item "$env:TEMP\kw-install\kube-workspaces-windows-amd64\*" "$env:LocalAppData\Programs\Kube Workspaces" -Force'
            echo "Get-ChildItem \"\$env:LocalAppData\Programs\Kube Workspaces\*.exe\" | Unblock-File"
            echo '```'
            echo
            echo 'The `.msi` files above are an **unsigned test distribution** for install hygiene'
            echo '(Start Menu shortcut, Add/Remove entry, upgrade/uninstall; per-user by default,'
            echo '`msiexec /i <file> ALLUSERS=1 INSTALLDIR="C:\Program Files\Kube Workspaces"` elevated for'
            echo 'per-machine). They warn exactly like the zip — not a trust fix. windows/arm64'
            echo 'is shell-only: container web UIs fall back to the system browser. Container'
            echo 'workspaces need the WebView2 Runtime (preinstalled on Windows 11, else the'
            echo 'Evergreen bootstrapper).'
            echo
            echo "> **These binaries are not code-signed.** macOS Gatekeeper will refuse to run"
            echo "> the app the first time: clear the quarantine attribute with"
            echo "> \`xattr -d com.apple.quarantine 'Kube Workspaces.app'\`, or open it once via"
            echo "> Finder → right-click → Open. Windows SmartScreen will warn: choose"
            echo "> \"More info\" → \"Run anyway\". Signing and notarisation are not yet set up."
            echo
            echo "The shell is cgo-free and bundles SDL. Container/scratch workspaces open in the"
            echo "embedded webview child (\`kube-workspaces-web\`) that ships inside each archive;"
            echo "on Linux that child needs WebKitGTK 4.1 (\`libwebkit2gtk-4.1\`). macOS and Windows"
            echo "use their bundled engines (WebKit, WebView2)."
            echo
            echo "## Getting started"
            echo
            echo '```bash'
            echo "kube-workspaces login --server https://workspaces.example.com  # opens your browser"
            echo "kube-workspaces list --running"
            echo "kube-workspaces                                                # graphical shell"
            echo '```'
            echo
            echo "If browser login gives trouble, \`--token <session-token>\` bypasses it."
            echo "On a machine with no OS keychain, set"
            echo "\`KUBE_WORKSPACES_INSECURE_TOKEN_FILE=1\` to fall back to a 0600 file."
            echo
          } > /tmp/release-notes.md

          # Version-specific section: the same preamble and categorised
          # "What's Changed" list the component repos publish. --skip-upgrade
          # drops the Helm upgrade block, which does not apply to a binary.
          from="$(git describe --tags --abbrev=0 "${VERSION}^")"
          /tmp/release-notes.sh --repo desktop-client \
            --from "$from" --to HEAD --version "$VERSION" --skip-upgrade \
            > /tmp/changelog.md
          cat /tmp/changelog.md >> /tmp/release-notes.md

          {
            echo
            echo "## Known caveats"
            echo
            echo "This is an early release. The UI has had limited validation on real displays,"
            echo "so expect rough edges in layout and scaling. Please report what you find."
          } >> /tmp/release-notes.md
          cat /tmp/release-notes.md

      # Idempotent: a re-pushed tag (amended commit) re-triggers this job with a
      # release already present, and `gh release create` then fails. Edit the
      # release and clobber-upload the assets instead of erroring.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.msi dist/SHA256SUMS \
            appimage/*.AppImage appimage/*.sha256 linuxpkgs/*/*.deb linuxpkgs/*/*.rpm linuxpkgs/*/*.flatpak \
            linuxpkgs/*/*.sha256 --clobber
