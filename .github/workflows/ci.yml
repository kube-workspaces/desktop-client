name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Vet and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd; run 'make fmt'"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '### Coverage'
              echo
              echo '```'
              go tool cover -func=coverage.out | tail -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The premise this job was written under turned out to be wrong: the SDL3
  # binding is purego, so the whole tree — session viewer included — is cgo-free
  # and cross-builds from one Linux host (see the Build workflow, which produces
  # the release archives that way).
  #
  # It is kept because compiling and testing natively still catches things a
  # cross-build cannot: platform-specific behaviour in path handling, the OS
  # keychain, and anything guarded by build tags. That is a different question
  # from "does it link", and worth a runner.
  cross:
    name: Native build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
