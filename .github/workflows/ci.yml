name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The Linux path is deliberately built cgo-free — web_nocgo.go — which is
  # exactly the variant the release archives ship (the webview's cgo stack,
  # webkit2gtk-4.1 via the third_party/webview_go fork, lives only in the
  # kube-workspaces-web child, built natively per OS in the Build workflow),
  # and macOS and Windows (see the cross job) cover the real cgo webview.
  #
  # The -race step is the one place cgo has to stay on for the detector; it
  # skips the packages that would otherwise drag webview_go into the build.
  build:
    name: Build, Vet and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # third_party/webview_go is a separate module kept as close to its
      # upstream pin as possible (a one-line pkg-config change, excluded from
      # lint the same way), so `go list ./...` — which enumerates only the main
      # module's package dirs — drives the gofmt check instead of a bare '.'.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd; run 'make fmt'"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -Ev '/(internal/web|internal/webcmd|cmd/kube-workspaces-web|cmd/kube-workspaces)$')

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            {
              echo '### Coverage'
              echo
              echo '```'
              go tool cover -func=coverage.out | tail -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The premise this job was written under turned out to be wrong: the SDL3
  # binding is purego, so the whole tree — session viewer included — is cgo-free
  # and cross-builds from one Linux host (see the Build workflow, which produces
  # the release archives that way).
  #
  # It is kept because compiling and testing natively still catches things a
  # cross-build cannot: platform-specific behaviour in path handling, the OS
  # keychain, and anything guarded by build tags. That is a different question
  # from "does it link", and worth a runner.
  cross:
    name: Native build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds cgo-free (web_nocgo.go), which is what the release
        # archives ship: the webview's cgo stack lives in the per-OS
        # kube-workspaces-web child (see the Build workflow), not in the shell.
        # macOS and Windows compile the real cgo webview.
        include:
          - os: ubuntu-latest
            cgo: "0"
          - os: macos-latest
            cgo: "1"
          - os: windows-latest
            cgo: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./...
