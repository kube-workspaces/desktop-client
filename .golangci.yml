# golangci-lint v2 configuration.
#
# Deliberately modest: the default set plus a few that catch real bugs. No
# style-police linters (lll, dupl, gocyclo, goconst) — protocol code such as
# internal/rfb is naturally long, repetitive and full of magic numbers, and
# fighting that produces worse code, not better.
version: "2"

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    misspell:
      # No locale is set deliberately. With one, misspell enforces a dialect and
      # then fights the code: Go identifiers must use the standard library's US
      # spelling (image/color) and CSS keywords are US ("center"), while the
      # prose here is British. Locale-less, misspell still catches genuine
      # typos, which is the part with actual value.
      ignore-rules:
        - color
        - colors
    errcheck:
      # Writes to an already-buffered writer (tabwriter, stdout) and deferred
      # Close calls on things being torn down cannot be meaningfully handled in
      # a CLI: the error surfaces from the subsequent Flush, or the process is
      # exiting anyway. Checking them adds noise without adding correctness.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

  exclusions:
    generated: lax
    rules:
      # Tests are allowed to ignore errors from helpers and to shadow names for
      # table-driven readability.
      - linters:
          - errcheck
          - revive
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/web$
      - internal/webcmd$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/web$
      - internal/webcmd$
